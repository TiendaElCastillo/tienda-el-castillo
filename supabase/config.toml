# Supabase Edge Functions configuration
# Keep the order, player-validation and admin read endpoints protected by JWT.
# The catalog sync endpoint uses its own x-sync-token check in the function body.
[functions.central-one-read]
verify_jwt = true

[functions.central-one-sync]
verify_jwt = false

[functions.central-one-player-validate]
verify_jwt = true

[functions.central-one-order]
verify_jwt = true
